name: Deploy

# 从 Pages（next-on-pages）迁到 Workers（OpenNext）后的部署流程。
# 触发：push 到 main，或手动。
# 注意：靠 push 触发，不依赖 tag；Worker 上的 secrets（AUTH_SECRET /
# AUTH_TRUST_HOST / DISABLE_REGISTER）不会被 wrangler deploy 覆盖。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 15 https://moepush.unmi.me/api/auth/providers | grep -q credentials; then
              echo "✅ 健康检查通过"
              exit 0
            fi
            sleep 5
          done
          echo "❌ 健康检查失败"
          exit 1

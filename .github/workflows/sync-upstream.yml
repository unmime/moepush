name: Sync Upstream

on:
  # 已关闭定时自动同步。
  # 本仓库已迁移到 OpenNext 并深度定制（lib/db、lib/auth、17 个路由的 runtime 声明），
  # 上游仍是 next-on-pages 版本：自动 merge 要么冲突，要么把定制改动回退，
  # 回退后再触发部署会直接搞挂线上。需要同步时手动运行并人工解决冲突。
  # schedule:
  #   - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        run: |
          git remote add upstream https://github.com/beilunyang/moepush.git
          git fetch upstream
          git merge upstream/main --no-edit
          git push origin main
